<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>王寺工業高校 1年A組 情報電子工学科ページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8f9fa; color: #333; }

    /* パスワード画面 */
    .password-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: #333; color: white;
    }
    .password-screen input, .password-screen button {
      padding: 10px; font-size: 16px; margin-top: 10px;
    }

    /* ヘッダー */
    header {
      background: #005bac; color: white; padding: 10px 20px;
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .logo { font-size: 20px; font-weight: bold; }
    nav ul { display: flex; list-style: none; gap: 15px; }
    nav ul li a { color: white; text-decoration: none; font-weight: 600; cursor: pointer; }
    nav ul li a:hover { text-decoration: underline; }
    .menu-toggle { display: none; font-size: 22px; cursor: pointer; }

    /* ヒーローエリア */
    .hero { position: relative; width: 100%; overflow: hidden; }
    .hero-img { display: block; width: 100%; height: auto; transition: opacity 1.5s ease; }
    .hero-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); }
    .hero-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 1; }
    .hero-text h1 { font-size: 48px; margin-bottom: 15px; font-weight: bold; }

    /* コンテンツ */
    .page-content { max-width: 1100px; margin: 30px auto; padding: 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .card h1, .card h2 { color: #005bac; margin-bottom: 10px; }
    iframe { border: none; width: 100%; border-radius: 8px; }

    /* ボタン */
    .button { display: inline-block; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center; transition: 0.3s; }
    .button-blue { background: linear-gradient(135deg, #007bff, #0056b3); color: white; }

    /* カウントダウン */
    .countdown-card {
      background: #0b0f1a; color: #e6ffff; border: 2px solid #00ffff;
      border-radius: 16px; padding: 20px; text-align: center; font-family: "Roboto Mono", monospace;
    }
    .time-glow { color: #00ff9c; font-weight: bold; animation: glow 1.8s infinite alternate; font-size: 1.5em; }
    @keyframes glow { from { text-shadow: 0 0 4px rgba(0,255,156,0.5); } to { text-shadow: 0 0 10px rgba(0,255,156,1); } }

    /* --- リアルタイム人数モーダル --- */
    #visitor-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9); color: #00ffff; padding: 30px 60px;
      border: 3px solid #00ffff; border-radius: 20px; z-index: 9999;
      text-align: center; font-family: 'Roboto Mono', monospace;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
    #visitor-modal h2 { font-size: 1.2rem; margin-bottom: 10px; color: #fff; }
    #visitor-num { font-size: 4rem; font-weight: bold; }

    footer { background: #222; color: white; text-align: center; padding: 15px 0; margin-top: 30px; }

    @media (max-width: 768px) {
      nav ul { display: none; flex-direction: column; background-color: #005bac; position: absolute; top: 60px; right: 0; width: 200px; padding: 10px; }
      nav ul.show { display: flex; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

<!-- パスワード画面 -->
<div class="password-screen" id="password-screen">
  <h1>1IA 専用ページ パスワード</h1>
  <input type="password" id="password-input" placeholder="パスワードを入力">
  <button id="submit-btn">送信</button>
</div>

<!-- メインコンテンツ -->
<div class="main-content" id="main-content" style="display:none;">
  <header>
    <div class="logo">1年 I科 A組</div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <nav>
      <ul id="nav-list">
        <li><a onclick="showPage('home')">🏠ホーム</a></li>
        <li><a onclick="showPage('schedule')">📅時間割</a></li>
        <li><a onclick="showPage('calendar')">🗓️カレンダー</a></li>
        <li><a onclick="showPage('gakusyuu')">📖学習/AI</a></li>
        <li><a onclick="showPage('test')">📝テスト</a></li>
        <li><a onclick="showPage('haihubutu')">📁プリント</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <img src="https://rerizu2.github.io/oji-2025-1AI/文化祭.png" class="hero-img">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>ようこそ 1IA ページへ</h1>
      <p>情報電子工学科</p>
    </div>
  </section>

  <section class="page-content" id="page-content"></section>

  <footer>
    <p>&copy; 2025 王寺工業高等学校 1年A組 I科</p>
  </footer>
</div>

<!-- リアルタイム人数表示パネル -->
<div id="visitor-modal">
  <h2>CURRENT ONLINE USERS</h2>
  <div id="visitor-num">--</div>
  <p style="font-size: 0.7rem; color: #666; margin-top: 15px;">[Ctrl + X] to Close</p>
</div>

<script type="module">
  // --- Firebase SDK のインポート ---
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
  import { getDatabase, ref, onValue, push, onDisconnect, set } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  // --- 提供された Firebase 設定 ---
  const firebaseConfig = {
    apiKey: "AIzaSyBjh3yMjfa5cTAfLpWEoPsv35aym0y0DtY",
    authDomain: "ia-f3e2a.firebaseapp.com",
    projectId: "ia-f3e2a",
    storageBucket: "ia-f3e2a.firebasestorage.app",
    messagingSenderId: "596639187551",
    appId: "1:596639187551:web:6f35db5f3845d1836e11ea",
    measurementId: "G-STSNZ96YSZ"
  };

  // Firebase 初期化
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  /* ==========================================
     リアルタイム閲覧人数カウントのロジック
     ========================================== */
  const visitorCountRef = ref(db, 'online_users');
  
  // ページにアクセスした際に自分のIDをリストに追加
  const myPresenceRef = push(visitorCountRef);
  
  // ブラウザを閉じたら（切断されたら）自動で削除する設定
  onDisconnect(myPresenceRef).remove();
  set(myPresenceRef, { active: true, time: Date.now() });

  // 全体の人数を常に監視
  onValue(visitorCountRef, (snapshot) => {
    const count = snapshot.size; // 子要素の数が現在の人数
    document.getElementById('visitor-num').innerText = count;
  });

  /* ==========================================
     Ctrl+X キー検知
     ========================================== */
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
      e.preventDefault();
      const modal = document.getElementById('visitor-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }
  });

  /* ==========================================
     既存のサイト機能 (グローバル関数として登録)
     ========================================== */
  const hashedPassword = "010f205df33f64fd3d9c046d7a242e2cee1a0a50a9222af275a380bf9e69a8ae";

  async function sha256Hex(text){
    const data=new TextEncoder().encode(text);
    const hashBuffer=await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  window.checkPassword = async () => {
    const input = document.getElementById("password-input").value.trim();
    const inputHash = await sha256Hex(input);
    if(inputHash === hashedPassword){
      document.getElementById("password-screen").style.display="none";
      document.getElementById("main-content").style.display="block";
      showPage('home');
      startTimers();
    } else {
      alert("パスワードが違います！");
    }
  };
  document.getElementById('submit-btn').addEventListener('click', window.checkPassword);

  window.toggleMenu = () => {
    document.getElementById("nav-list").classList.toggle("show");
  };

  window.showPage = (page) => {
    const content = document.getElementById("page-content");
    const width = window.innerWidth > 800 ? 1000 : 350;

    if(page === 'home'){
      content.innerHTML = `
        <div class="card">
          <h1>お知らせ</h1>
          <p>Ctrl + X キーを押すと、現在このページを見ている人数を確認できます。</p>
        </div>
        <div class="card">
          <h2>📢 更新情報</h2>
          <ul><li>2026/1/10：人数確認機能(Ctrl+X)を実装しました。</li></ul>
        </div>
        <div class="countdown-card">
          <h3>2026.03.19 3学期終了まで</h3>
          <div id="countdown-school" class="time-glow">Loading...</div>
        </div>`;
    } else if(page === 'schedule'){
      content.innerHTML = `<h1>時間割</h1><iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0try5rh29bXvIfaEkguZxKXkh4qunWPHoAbNkZOreHdqWw_nLAQjdhCZ90JxvPlEfPdnSZ39hcfSy/pubhtml?widget=true&headers=false" height="400"></iframe>`;
    } else if(page === 'gakusyuu'){
      content.innerHTML = `<h1>席替えシステム</h1><iframe src="https://rerizu2.github.io/oji-2025-1AI/%E5%B8%AD%E6%9B%BF%E3%81%88.html" height="600"></iframe>`;
    } else if(page === 'test'){
      content.innerHTML = `<h1>テスト範囲</h1><iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRE3WB1xgKs3cxvjvuwiTDk5uPFO2bMzNCiQQbMaOfI5m9hWmkxZVn8qmideHJYVr8-_iGbB2KxgAzv/pubhtml?gid=1730831513&single=true&widget=true&headers=false" height="800"></iframe>`;
    } else if(page === 'haihubutu'){
      content.innerHTML = `<h1>配布プリント</h1><iframe src="https://drive.google.com/embeddedfolderview?id=1UfqzRA8LqoqjK4_eUPLElhQr80cMGJFM#grid" height="500"></iframe>`;
    }
    document.getElementById("nav-list").classList.remove("show");
  };

  function startTimers() {
    setInterval(() => {
      const now = new Date();
      const target = new Date("2026-03-19T00:00:00");
      const diff = target - now;
      const el = document.getElementById("countdown-school");
      if(el && diff > 0){
        const d = Math.floor(diff/86400000);
        const h = Math.floor((diff%86400000)/3600000);
        const m = Math.floor((diff%3600000)/60000);
        const s = Math.floor((diff%60000)/1000);
        el.textContent = `${d}日 ${h}時間 ${m}分 ${s}秒`;
      }
    }, 1000);
  }
</script>

</body>
</html>
