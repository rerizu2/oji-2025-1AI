<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>王寺工業高校 1年A組 情報電子工学科ページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&family=Roboto+Mono&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK の読み込み (リアルタイム人数集計用) -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8f9fa; color: #333; }

    /* パスワード画面 */
    .password-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: #333; color: white;
    }
    .password-screen input, .password-screen button {
      padding: 10px; font-size: 16px; margin-top: 10px;
    }
    #qr-reader {
      width: 100%; max-width: 320px; margin-top: 10px; display: none;
      border: 3px solid #ffa502; border-radius: 10px; padding: 10px; background-color: white;
    }

    /* ヘッダー */
    header {
      background: #005bac; color: white; padding: 10px 20px;
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .logo { font-size: 20px; font-weight: bold; }
    nav ul { display: flex; list-style: none; gap: 15px; }
    nav ul li a { color: white; text-decoration: none; font-weight: 600; cursor: pointer; }
    nav ul li a:hover { text-decoration: underline; }
    .menu-toggle { display: none; font-size: 22px; cursor: pointer; }

    /* ヒーローエリア */
    .hero { position: relative; width: 100%; overflow: hidden; }
    .hero-img { display: block; width: 100%; height: auto; transition: opacity 1.5s ease; }
    .hero-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); }
    .hero-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 1; }
    .hero-text h1 { font-size: 48px; margin-bottom: 15px; font-weight: bold; }
    .hero-text p { font-size: 22px; font-weight: bold; }

    /* コンテンツ */
    .page-content { max-width: 1100px; margin: 30px auto; padding: 20px; }
    .card {
      background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    .card h2, .card h1 { color: #005bac; margin-bottom: 10px; }
    .card ul { margin-left: 20px; margin-top: 10px; }
    iframe { border: none; width: 100%; border-radius: 8px; }

    /* ボタン */
    .button {
      display: inline-block; padding: 12px 20px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center;
      transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .button-blue { background: linear-gradient(135deg, #007bff, #0056b3); color: white; }

    /* カウントダウン表示 */
    .countdown-card {
      background: #0b0f1a; color: #e6ffff; border: 2px solid #00ffff;
      border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center;
      font-family: "Roboto Mono", monospace; box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }
    .countdown-card h3 { color: #00ffff; margin-top: 15px; margin-bottom: 5px; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
    .cd-panel { margin: 5px 0 15px 0; padding: 10px; background: rgba(0, 255, 255, 0.08); border: 1px solid #00ffff; border-radius: 8px; font-size: 1.2em; }
    .time-glow { color: #00ff9c; font-weight: bold; animation: glow 1.8s infinite alternate; }
    @keyframes glow { from { text-shadow: 0 0 4px rgba(0,255,156,0.5); } to { text-shadow: 0 0 10px rgba(0,255,156,1); } }

    /* ----------------------------------------------------
       Ctrl+X で表示される人数用モーダル (追加分)
    ---------------------------------------------------- */
    #visitor-count-modal {
      display: none; /* 初期状態は非表示 */
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95); color: #00ffff; padding: 40px;
      border: 3px solid #00ffff; border-radius: 20px; z-index: 10001;
      text-align: center; font-family: 'Roboto Mono', monospace;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    }
    #visitor-count-modal h2 { font-size: 1.2em; margin-bottom: 20px; color: #fff; }
    #visitor-num { font-size: 5em; font-weight: bold; color: #00ff9c; }
    .shortcut-tip { font-size: 0.8em; color: #888; margin-top: 20px; }

    footer { background: #222; color: white; text-align: center; padding: 15px 0; margin-top: 30px; }

    @media (max-width: 768px) {
      nav ul { display: none; flex-direction: column; background-color: #005bac; position: absolute; top: 60px; right: 0; width: 200px; padding: 10px; }
      nav ul.show { display: flex; }
      .menu-toggle { display: block; }
      .hero-text h1 { font-size: 32px; }
    }
  </style>
</head>

<body>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<!-- パスワード画面 -->
<div class="password-screen" id="password-screen">
  <h1>パスワードを入力してください</h1>
  <input type="password" id="password-input" placeholder="パスワード">
  <button onclick="checkPassword()">送信</button>
  <div id="qr-controls">
    <button onclick="startQrScanner()">📷 QRで読み取る</button>
    <div id="qr-reader"></div>
  </div>
</div>

<!-- 本編 -->
<div class="main-content" id="main-content" style="display:none;">
  <header>
    <div class="logo">1年 I科 A組</div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <nav>
      <ul id="nav-list">
        <li><a onclick="showPage('home')">🏠ホーム</a></li>
        <li><a onclick="showPage('schedule')">📅時間割</a></li>
        <li><a onclick="showPage('calendar')">🗓️カレンダー</a></li>
        <li><a onclick="showPage('ibento')">🎉イベント</a></li>
        <li><a onclick="showPage('gakusyuu')">📖学習/AI</a></li>
        <li><a onclick="showPage('test')">📝テスト</a></li>
        <li><a onclick="showPage('haihubutu')">📁プリント</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <img src="https://rerizu2.github.io/oji-2025-1AI/文化祭.png" class="hero-img">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>ようこそ 1IA ページへ</h1>
      <p>情報電子工学科</p>
    </div>
  </section>

  <section class="page-content" id="page-content"></section>

  <footer>
    <p>&copy; 2025 王寺工業高等学校 1年A組 I科</p>
  </footer>
</div>

<!-- 閲覧人数表示モーダル -->
<div id="visitor-count-modal">
  <h2>現在閲覧中の人数</h2>
  <div id="visitor-num">1</div>
  <p class="shortcut-tip">[Ctrl + X] で閉じる</p>
</div>

<script>
/* ==========================================
   1. パスワード・基本機能
   ========================================== */
const hashedPassword = "010f205df33f64fd3d9c046d7a242e2cee1a0a50a9222af275a380bf9e69a8ae";

async function sha256Hex(text){
  const data=new TextEncoder().encode(text);
  const hashBuffer=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){
  const input=document.getElementById("password-input").value.trim();
  if(!input){alert("パスワードを入力してください。");return;}
  const inputHash=await sha256Hex(input);
  if(inputHash===hashedPassword){
    document.getElementById("password-screen").style.display="none";
    document.getElementById("main-content").style.display="block";
    showPage('home');
    startTimers();
    initFirebase(); // パスワード突破後にFirebase開始
  }else{
    alert("パスワードが違います！");
  }
}

function toggleMenu(){
  document.getElementById("nav-list").classList.toggle("show");
}

function getResponsiveWidth(){
  const w=window.innerWidth;
  return w > 1000 ? 1000 : (w > 600 ? 600 : 300);
}

const countdownHTML=`
<div class="countdown-card">
  <h3>2026.03.19 3学期終了まで</h3>
  <div id="countdown-school" class="cd-panel time-glow">Loading...</div>
  <div id="current-time" class="cd-panel" style="font-size:0.85em;">現在時刻: Loading...</div>
  <div id="elapsed-time" class="cd-panel" style="font-size:0.85em;">今年の経過: Loading...</div>
</div>`;

function showPage(page){
  const content=document.getElementById("page-content");
  if(page==='home'){
    content.innerHTML=`
      <div class="card">
        <h1>1IAホームページの閉鎖について</h1>
        <p>1IAホームページは2026年3月19日を持ちまして閉鎖します。<br>新しいホームページは以下のものになります。<a href="https://rerizu2.github.io/oji-2026-2IA/%E7%8E%8B%E5%AF%BA%E5%B7%A5%E6%A5%AD-2IA-2026.html">2IAホームページ</a></p>
      </div>
      <div class="card">
        <h2>📢 更新情報</h2>
        <ul><li>2026/1/10：提出物システムPROを追加。</li><li>...略...</li></ul>
      </div>
      ${countdownHTML}
      <div class="card">
        <h1>このページについて</h1>
        <p>このページは1IAの皆様・保護者専用です。隠し機能：Ctrl+Xで閲覧人数を表示</p>
      </div>`;
  }
  else if(page==='schedule'){
    content.innerHTML=`<h1>時間割</h1><iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0try5rh29bXvIfaEkguZxKXkh4qunWPHoAbNkZOreHdqWw_nLAQjdhCZ90JxvPlEfPdnSZ39hcfSy/pubhtml?widget=true&headers=false" width="${getResponsiveWidth()}" height="300"></iframe>`;
  }
  else if(page==='gakusyuu'){
    content.innerHTML=`<h1>席替えシステム</h1><iframe src="https://rerizu2.github.io/oji-2025-1AI/%E5%B8%AD%E6%9B%BF%E3%81%88.html" width="100%" height="800"></iframe>
    <h1>提出物システムPRO</h1><a href="https://script.google.com/macros/s/AKfycby3CMK9N_sFcUB1SgArFMoSUWzZo7zFp_adZpb-KkC4OPI9eM4dY0Up-jw0jxMqUgbu/exec" class="button button-blue" target="_blank">リンクを開く</a>`;
  }
  else if(page==='test'){
    content.innerHTML=`<h1>テスト範囲</h1><iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRE3WB1xgKs3cxvjvuwiTDk5uPFO2bMzNCiQQbMaOfI5m9hWmkxZVn8qmideHJYVr8-_iGbB2KxgAzv/pubhtml?gid=1730831513&single=true&widget=true&headers=false" width="100%" height="1000"></iframe>`;
  }
  else if(page==='haihubutu'){
    content.innerHTML=`<h1>配布プリント</h1><iframe src="https://drive.google.com/embeddedfolderview?id=1UfqzRA8LqoqjK4_eUPLElhQr80cMGJFM#grid" style="width:100%;height:400px;"></iframe>`;
  }
  document.getElementById("nav-list").classList.remove("show");
}

function updateAllTimers(){
  const now=new Date();
  const target=new Date("2026-03-19T00:00:00");
  const diff=target-now;
  const el=document.getElementById("countdown-school");
  if(el){
    if(diff<=0){el.textContent="到達しました";}
    else{
      const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
      el.textContent=`${d}d ${h}h ${m}m ${s}s`;
    }
  }
}
function startTimers(){ setInterval(updateAllTimers,1000); updateAllTimers(); }

/* ==========================================
   2. リアルタイム人数集計 (Firebase)
   ========================================== */
function initFirebase() {
  // --- ここにあなたのFirebaseプロジェクトの設定を貼り付けてください ---
  // 設定がない場合は、デモとして動作します。
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
  };

  // デモ用のフラグ（APIキーが未設定の場合）
  if (firebaseConfig.apiKey === "YOUR_API_KEY") {
    console.warn("Firebaseが設定されていません。閲覧人数はデモモードです。");
    document.getElementById('visitor-num').innerText = "1"; // デモ用固定値
    return;
  }

  // Firebase初期化
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const visitorCountRef = db.ref("online_users");

  // 接続管理ロジック
  const myPresenceRef = visitorCountRef.push();
  // ブラウザを閉じたら削除
  myPresenceRef.onDisconnect().remove();
  myPresenceRef.set({ last_seen: Date.now() });

  // リアルタイムで人数をカウントして表示を更新
  visitorCountRef.on("value", (snapshot) => {
    const count = snapshot.numChildren();
    document.getElementById('visitor-num').innerText = count;
  });
}

/* ==========================================
   3. Ctrl+X キー検知イベント
   ========================================== */
window.addEventListener('keydown', function(e) {
  // Ctrl (またはMacのCmd) + X が押されたか判定
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
    e.preventDefault(); // 本来の「切り取り」動作を防ぐ
    const modal = document.getElementById('visitor-count-modal');
    // 表示・非表示を切り替え
    if (modal.style.display === 'block') {
      modal.style.display = 'none';
    } else {
      modal.style.display = 'block';
    }
  }
});
</script>
</body>
</html>
