<section class="panel">
  <h2>📜 録画履歴</h2>
  <ul id="historyList"></ul>
</section>

<script>
  // ...（既存の録画処理は省略）...

  async function handleStop(){
    clearInterval(timerId); timerEl.textContent = '00:00:00';
    statusEl.textContent = '保存準備中…';

    [displayStream, micStream, mixedStream].forEach(s => s && s.getTracks().forEach(t => t.stop()));

    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);

    const ts = new Date();
    const fname = `screenrec_${ts.getFullYear()}-${fmt(ts.getMonth()+1)}-${fmt(ts.getDate())}_${fmt(ts.getHours())}${fmt(ts.getMinutes())}${fmt(ts.getSeconds())}.webm`;
    filenameEl.textContent = fname;
    filesizeEl.textContent = `${(blob.size/1024/1024).toFixed(2)} MB`;

    dl.href = url; dl.download = fname; dl.hidden = false;
    statusEl.textContent = '完了（ダウンロード可能）';

    pickScreenBtn.disabled = false; startBtn.disabled = true; pauseBtn.disabled = true; stopBtn.disabled = true;
    pauseBtn.textContent = '⏸ 一時停止';
    document.title = '画面録画ツール (完了)';
    timerEl.classList.remove('rec');

    // === 録画履歴管理 ===
    saveRecording(blob, fname);
  }

  // BlobをBase64に変換してlocalStorageに保存
  function saveRecording(blob, filename){
    const reader = new FileReader();
    reader.onloadend = function(){
      const base64 = reader.result; // data:video/webm;base64,xxxx
      const record = {
        name: filename,
        size: blob.size,
        type: blob.type,
        data: base64
      };

      // 既存履歴を取得
      const history = JSON.parse(localStorage.getItem("recordHistory") || "[]");
      history.unshift(record); // 最新を先頭に追加
      localStorage.setItem("recordHistory", JSON.stringify(history));

      renderHistory();
    };
    reader.readAsDataURL(blob);
  }

  // 履歴を読み出してリストに描画
  function renderHistory(){
    const history = JSON.parse(localStorage.getItem("recordHistory") || "[]");
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    if(history.length === 0){
      list.innerHTML = "<li>履歴はありません</li>";
      return;
    }

    history.forEach((rec, idx) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <b>${rec.name}</b> (${(rec.size/1024/1024).toFixed(2)} MB)
        <a href="${rec.data}" download="${rec.name}">⬇️ ダウンロード</a>
      `;
      list.appendChild(li);
    });
  }

  // ページ読み込み時に履歴を表示
  window.addEventListener("DOMContentLoaded", renderHistory);
</script>
